name: Test and release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binaries and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          for target in \
            linux/amd64 linux/arm64 \
            windows/amd64 windows/arm64 \
            darwin/amd64 darwin/arm64
          do
            IFS=/ read -r os arch <<< "$target"
            binary="tinkey-${os}-${arch}"
            if [ "$os" = windows ]; then
              binary="${binary}.exe"
            fi

            echo "Building ${binary}"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
              go build -trimpath -ldflags="-s -w" -o "dist/${binary}" .
            (
              cd dist
              sha256sum "$binary" > "${binary}.sha256"
            )
          done

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          build_date="$(date -u +%F)"
          build_date_compact="${build_date//-/}"
          tag="build-${build_date_compact}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" dist/* \
            --target "$GITHUB_SHA" \
            --title "Build ${build_date}" \
            --notes "Automated build of main commit ${GITHUB_SHA} on ${build_date}."
